# ============================================================
# nginx equivalent of .htaccess — REQUIRED because the production
# server runs nginx, which does not read .htaccess files at all.
# Everything in .htaccess has been silently ignored on the live site.
# ============================================================
#
# INSTALL INSTRUCTIONS:
# 1. SSH into the server.
# 2. Find the existing site config, usually one of:
#      /etc/nginx/sites-available/haulinjunkies.com
#      /etc/nginx/conf.d/haulinjunkies.com.conf
# 3. The MAP BLOCK below must go in the `http {}` context — either
#    directly in /etc/nginx/nginx.conf inside the http block, or in
#    its own file included from there (e.g. /etc/nginx/conf.d/redirects-map.conf
#    if conf.d is auto-included by the main nginx.conf — check first).
# 4. The SERVER BLOCK ADDITIONS must go inside the existing
#    `server { ... }` block for haulinjunkies.com (the one that
#    already handles HTTPS/www — do not create a second server block).
# 5. Test before reloading: sudo nginx -t
# 6. Reload (zero downtime): sudo systemctl reload nginx
#
# After reload, verify with:
#   curl -I https://haulinjunkies.com/estate_cleanout.php   (should be 301, not 200)
#   curl -I https://haulinjunkies.com/orlando.php            (should be 301, not 200)
#   curl -I https://haulinjunkies.com/baldwin-park-village-center.php  (should be 301, not 404)
#   curl -I https://haulinjunkies.com/audubon-park.php       (should be 301, not 404 -- confirmed
#                                                              404 live in production as of 2026-08-24)
#   curl -I https://haulinjunkies.com/dr-phillips.php        (should be 301, not 404)
# ============================================================
#
# STATUS (2026-08-24): This file was written 2026-08-09 and has NEVER
# been installed on production -- verified live via curl that
# audubon-park.php, wedgfield.php, dr-phillips.php, and orlando.php all
# still return their un-redirected status (404 or 200) on the real site.
# This is very likely the dominant cause of the 121 "Not found (404)"
# URLs in the 2026-08-24 GSC Page Indexing export: every redirect this
# team has written into .htaccess since day one has been silently
# ignored by nginx. Installing this file is the single highest-leverage
# fix available right now.
# ============================================================


# ---------- 1. MAP BLOCK (place inside http {} context) ----------

map $uri $legacy_redirect {
    default                                     "";

    # Underscore URL fixes
    /apartment_cleanouts.php                    /apartment-cleanouts.php;
    /estate_cleanout.php                        /estate-cleanout.php;

    # orlando.php was cannibalizing the homepage for "junk removal orlando"
    /orlando.php                                /;

