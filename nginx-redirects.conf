# ---------- 2. SERVER BLOCK ADDITIONS (place inside the existing server {} for haulinjunkies.com) ----------

    # Directory listing off (equivalent of "Options -Indexes")
    autoindex off;

    # Custom 404 page
    error_page 404 /404.php;

    # Legacy .html URLs -> .php equivalents (old site version still indexed by Google)
    rewrite ^/(.+)\.html$ /$1.php permanent;

    # /index.php -> / (canonical homepage URL)
    location = /index.php {
        return 301 /;
    }

    # All mapped legacy/underscore/deleted-subpage redirects (see map block above)
    if ($legacy_redirect) {
        return 301 $legacy_redirect;
    }
