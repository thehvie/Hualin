location = /wedgfield.php { return 301 /alafaya.php; }
location = /minneola.php { return 301 /clermont.php; }
location = /groveland.php { return 301 /clermont.php; }
location = /audubon-park.php { return 301 /baldwin-park.php; }
location = /colonialtown.php { return 301 /downtown-orlando.php; }
location = /conway.php { return 301 /hunters-creek.php; }
location = /delaney-park.php { return 301 /downtown-orlando.php; }
location = /lake-eola-heights.php { return 301 /downtown-orlando.php; }
location = /lake-lawsona.php { return 301 /downtown-orlando.php; }
location = /holden-parramore.php { return 301 /downtown-orlando.php; }
location = /metro-west.php { return 301 /downtown-orlando.php; }
location = /mills-50-district.php { return 301 /downtown-orlando.php; }
location = /south-eola.php { return 301 /downtown-orlando.php; }
