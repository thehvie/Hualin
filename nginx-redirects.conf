# ============================================================
# nginx redirect patch for haulinjunkies.com
# ============================================================
#
# CORRECTED STATUS (2026-08-25): an earlier version of this file
# claimed the ENTIRE .htaccess redirect strategy had never been
# installed on production. That was wrong -- only spot-checked
# via curl on 2 URLs (audubon-park.php, orlando.php) and
# over-generalized from there.
#
# The real picture, confirmed via `sudo nginx -T` and
# `sudo cat /etc/nginx/sites-enabled/haulinjunkies.com` on the
# droplet: production already has a working, LIVE redirect file at
#   /etc/nginx/snippets/haulinjunkies-redirects.conf
# included directly into the site's server block. It already
# correctly 301s apartment_cleanouts.php, estate_cleanout.php, and
# all the baldwin-park-*/winter-park-*/windermere-*/maitland-*
# sub-pages (confirmed live with curl -I, all return 301).
#
# What's actually missing from that live file: the 17 location
# pages pruned 2026-08-16, plus orlando.php -> / and the
# dr-phillips.php -> doctor-phillips.php broken-link fix. The
# .html -> .php rewrite and /index.php -> / redirect are ALSO
# already live -- they're in the server block itself, not this
# snippet.
#
# This file is now just the ADDENDUM to paste onto the end of the
# live snippet -- not a full replacement, and not a map-based
# rewrite of the whole thing. Matches the live file's syntax
# (plain `location = /x { return 301 /y; }` blocks) so it can be
# appended as-is.
# ============================================================
#
# INSTALL (on the droplet, via SSH or the DigitalOcean web console):
#
#   sudo tee -a /etc/nginx/snippets/haulinjunkies-redirects.conf > /dev/null <<'EOF'
#   <paste everything below the divider>
#   EOF
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Verify afterward:
#   curl -I https://haulinjunkies.com/audubon-park.php   (want 301, not 404)
#   curl -I https://haulinjunkies.com/wedgfield.php      (want 301, not 404)
#   curl -I https://haulinjunkies.com/orlando.php        (want 301, not 200)
#   curl -I https://haulinjunkies.com/dr-phillips.php    (want 301, not 404)
# ============================================================
# ---------------------- addendum below ----------------------

# orlando.php was cannibalizing the homepage for "junk removal orlando"
location = /orlando.php { return 301 /; }

# Broken internal link: orlando.php links to dr-phillips.php, real file is doctor-phillips.php
location = /dr-phillips.php { return 301 /doctor-phillips.php; }

# 17 thin/duplicate location pages pruned 2026-08-16 -> nearest kept hub
location = /geneva.php { return 301 /oviedo.php; }
